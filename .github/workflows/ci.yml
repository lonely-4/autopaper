name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: 单测 + CLI 冒烟（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 编译
        run: dotnet build -c Release

      - name: 单元测试
        run: dotnet test -c Release --no-build

      # 同一份脚本在 Windows 和 Linux 上都跑，靠 shell: bash（runner 自带 Git Bash）。
      # 脚本里 apply 一律带 --dry-run，所以不会碰系统设置。
      - name: CLI 冒烟测试（示例配置）
        shell: bash
        run: ./scripts/smoke.sh

  wallpaper:
    name: 真机改壁纸格式实测（Windows）
    runs-on: windows-latest

    # 2026-09-18 首次实测：GitHub 的 windows runner 有可用的桌面会话，
    # bmp / png / jpg / gif / tif 五种格式都真的设置成功并且注册表确认改到了，
    # 所以这里不再设 continue-on-error，让它变成硬性检查。
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 编译
        run: dotnet build -c Release

      - name: 逐个格式实测能不能真的设成壁纸
        shell: pwsh
        run: ./scripts/wallpaper-matrix.ps1

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    name: 构建 ${{ matrix.flavor }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: selfcontained
            # 自包含 + 单文件 + 裁剪：不依赖 .NET 运行时，体积 13.8 MB，作为兜底产物
            extra: '-p:PublishSingleFile=true -p:PublishTrimmed=true -p:InvariantGlobalization=true'

          - flavor: aot
            # Native AOT：3.2 MB、启动最快，作为主推产物。
            # 需要 MSVC 工具链和 Windows SDK，windows-latest 自带。
            # 2026-09-18 实测：CI 上零警告构建成功，产出的 exe 能跑 version 和 check。
            extra: '-p:PublishAot=true -p:InvariantGlobalization=true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 发布
        shell: bash
        run: |
          version="1.0.0"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "版本号：$version"

          dotnet publish src/AutoPaper \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:Version="$version" \
            -o "dist/${{ matrix.flavor }}" \
            ${{ matrix.extra }}

          ls -la "dist/${{ matrix.flavor }}"

      # 发布前最后一道关：确认打包出来的 exe 真能跑，别把一个坏二进制发出去
      - name: 确认 exe 能用
        shell: bash
        run: |
          exe="dist/${{ matrix.flavor }}/autopaper.exe"
          "$exe" version
          "$exe" check --config examples/config.yaml

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavor }}
          path: dist/${{ matrix.flavor }}/autopaper.exe
          if-no-files-found: error

  release:
    name: 建 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # aot 那一份可能因为 continue-on-error 而缺失，这里按实际存在的目录打包
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 打包
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          repo="$PWD"
          mkdir -p out

          for dir in artifacts/*/; do
            flavor="$(basename "$dir")"
            zipfile="$repo/out/autopaper-${version}-win-x64-${flavor}.zip"
            cp README.md "$dir/"
            (cd "$dir" && zip -r "$zipfile" .)
          done

          ls -la out

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.zip \
            --title "AutoPaper $GITHUB_REF_NAME" \
            --generate-notes
